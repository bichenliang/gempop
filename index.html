        :root {
            --black: #121212;
            --gold: #D4AF37;
            --light-gold: #FFD700;
            --gray: #f7f7f7;
            --text-gray: #555;
            --white: #ffffff;
        }
        .header-nav {
            background: var(--black);

            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .logo-text {
            color: var(--light-gold);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .pc-menu {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .pc-menu a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }
        .pc-menu a:hover {
            color: var(--gold);
        }
        .lang-switch-group{
            display:flex;
            gap:8px;
        }
        .lang-btn{
            border:1px solid var(--gold);
            color:var(--gold);
            background:transparent;
            padding:4px 8px;
            cursor:pointer;
        }
        .lang-btn.active{
            background:var(--gold);
            color:var(--black);
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 1001;
        }
        .hamburger span {
            width: 26px;
            height: 2px;
            background: #fff;
            display:block;
        }
        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: var(--black);
            padding: 40px 30px;
            transition: right 0.4s ease;
            z-index: 1000;
        }
        .mobile-sidebar.open {
            right: 0;
        }
        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
        }
        .mobile-sidebar a {
            display: block;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            margin: 22px 0;
        }
        .mobile-sidebar a:hover {
            color: var(--gold);
        }
        .mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 998;
        }
        .mask.show {
            display: block;
        }
        .banner-box {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), #222;
            height: 440px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }
        .banner-box h1 {
            color: var(--light-gold);
            font-size: 40px;
            margin-bottom: 18px;
        }
        .banner-desc {
            font-size: 18px;
            max-width: 750px;
            line-height: 1.9;
            margin-bottom: 30px;
        }
        .banner-btn {
            padding: 14px 36px;
            background: var(--gold);
            color: var(--black);
            text-decoration: none;
            font-weight: 600;
            border-radius: 3px;
            transition: 0.3s;
        }
        .banner-btn:hover {
            background: var(--light-gold);
        }
        .section-wrap {
            padding: 70px 5%;
        }
        .section-title {
            text-align: center;
            font-size: 30px;
            color: var(--black);
            margin-bottom: 48px;
        }
        .story-text {
            max-width: 1000px;
            margin: 0 auto 60px;
            text-align: center;
            line-height: 2;
            font-size: 17px;
            color: var(--text-gray);
        }
        .love-series-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 36px;
            margin-bottom: 70px;
        }
        .series-card {
            border: 1px solid #eee;
            padding: 32px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .series-card:hover {
            box-shadow: 0 8px 24px #ddd;
        }
        .series-card h3 {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 16px;
        }
        .series-card p {
            color: var(--text-gray);
            line-height: 1.8;
        }
        .product-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 32px;
            margin: 60px 0;
        }
        .product-card {
            border: 1px solid #eee;
            padding: 28px;
            border-radius: 8px;
        }
        .product-card h3 {
            color: var(--gold);
            margin-bottom: 14px;
            font-size: 20px;
        }
        .product-card p {
            color: var(--text-gray);
            line-height: 1.7;
        }
        .check-module {
            background: var(--gray);
            padding: 55px 5%;
            text-align: center;
            margin: 50px 0;
        }
        .check-input {
            width: 340px;
            padding: 14px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-right: 12px;
            border-radius: 2px;
        }
        .check-btn {
            padding: 14px 28px;
            background: var(--black);
            color: var(--light-gold);
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .check-result{
            max-width:700px;
            margin:30px auto 0;
            padding:25px;
            background:#fff;
            border:1px solid var(--gold);
            text-align:left;
            display:none;
            line-height:2;
        }
        .check-result.show{
            display:block;
        }
        #qrcode-box{
            margin-top:20px;
            text-align:center;
        }
        .check-tip {
            margin-top: 18px;
            color: #666;
        }
        .about-text {
            max-width: 920px;
            margin: 0 auto;
            line-height: 1.9;
            font-size: 16px;
            color: var(--text-gray);
            text-align: center;
        }
        .care-wrap{
            max-width:960px;
            margin:0 auto;
        }
        .care-block{
            background:#f8f8f8;
            padding:24px;
            border-radius:8px;
            margin-bottom:30px;
        }
        .care-block h3{
            color:var(--gold);
            margin-bottom:16px;
            font-size:22px;
        }
        .care-block p,.care-block li{

                margin-bottom: 15px;
                margin-right: 0;

const closeMenu = document.getElementById("closeMenu");
const sideBar = document.getElementById("sideBar");
const maskLayer = document.getElementById("maskLayer");
openMenu.addEventListener("click",()=>{
    sideBar.classList.add("open");
    maskLayer.classList.add("show");
});
closeMenu.addEventListener("click",()=>{
    sideBar.classList.remove("open");
    maskLayer.classList.remove("show");
});
maskLayer.addEventListener("click",()=>{
    sideBar.classList.remove("open");
    maskLayer.classList.remove("show");
});

function renderLang(){
    const obj = langData[currentLang];
    document.querySelectorAll("[data-i18n]").forEach(el=>{
        const key = el.getAttribute("data-i18n");
        el.innerHTML = obj[key] || "";
    });
}

// 语言切换
document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
        currentLang = btn.dataset.lang;
        document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        renderLang();
    })
});

// 查询证书
const checkBtn = document.getElementById("checkBtn");
const codeInput = document.getElementById("codeInput");
const resultBox = document.getElementById("resultBox");
const resultContent = document.getElementById("resultContent");
const qrcodeBox = document.getElementById("qrcode-box");

checkBtn.addEventListener("click",()=>{
    const code = codeInput.value.trim().toUpperCase();
    if(!code){
        alert(langData[currentLang]["check.empty"]);
        return;
    }
    const item = langData["certList"][code];
    qrcodeBox.innerHTML = "";
    if(!item){
        resultContent.innerHTML = `<p style="color:red">${langData[currentLang]["check.notfound"]}</p>`;
        resultBox.classList.add("show");
        return;
    }
    let html = `<div>
        <p><strong>${langData[currentLang]["cert.no"]}：</strong>${code}</p>
        <p><strong>${langData[currentLang]["cert.name"]}：</strong>${item.name}</p>
        <p><strong>${langData[currentLang]["cert.spec"]}：</strong>${item.spec}</p>
        <p><strong>${langData[currentLang]["cert.date"]}：</strong>${item.date}</p>
    </div>`;
    resultContent.innerHTML = html;
    new QRCode(qrcodeBox,{text:code,width:160,height:160});
    resultBox.classList.add("show");
});

//页面初始化
renderLang();
document.querySelector(".lang-btn[data-lang='bm']").classList.add("active");
</script>
</body>
</html>
