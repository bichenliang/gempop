<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GemPop Moissanite Verification</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            color: #222;
            font-size: 28px;
        }
        #gpId {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            margin: 20px 0 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        #verifyBtn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
        #resultBox {
            margin-top: 20px;
            padding: 16px;
            border: 1px solid #eee;
            border-radius: 6px;
            min-height: 80px;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>GemPop Moissanite ID Verification System</h1>

    <input type="text" id="gpId" placeholder="Enter your Moissanite GP Stone ID (e.g. GP00001)">
    <button id="verifyBtn">Verify Moissanite Details</button>

    <div id="resultBox"></div>

    <script>
        let stoneData = [];
        const resultBox = document.getElementById('resultBox');

        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                stoneData = data;
            })
            .catch(err => {
                resultBox.innerText = "Unable to load stone database, please refresh later.";
            });

        document.getElementById('verifyBtn').addEventListener('click', () => {
            const inputId = document.getElementById('gpId').value.trim();
            const findItem = stoneData.find(item => item.gpId === inputId);

            if (findItem) {
                resultBox.innerHTML = `
                    <strong>Verification Successful</strong><br>
                    GP ID：${findItem.gpId}<br>
                    Stone Type：${findItem.stoneType}<br>
                    Carat Weight：${findItem.carat} ct<br>
                    Shape：${findItem.shape}<br>
                    Color Grade：${findItem.color}<br>
                    Clarity Grade：${findItem.clarity}<br>
                    Cut Grade：${findItem.cut}
                `;
            } else {
                resultBox.innerText = "This Moissanite GP ID cannot be found in our official database.";
            }
        });
    </script>
</body>
</html>
