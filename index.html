            --gray: #f7f7f7;
            --text-gray: #555;

            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .logo-text {
            color: var(--light-gold);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .pc-menu {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .pc-menu a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }
        .pc-menu a:hover {
            color: var(--gold);
        }
        .lang-switch-group{
            display:flex;
            gap:8px;
        }
        .lang-btn{
            border:1px solid var(--gold);
            color:var(--gold);
            background:transparent;
            padding:4px 8px;
            cursor:pointer;
        }
        /* 移动端汉堡按钮 */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 1001;
        }
        .hamburger span {
            width: 26px;
            height: 2px;
            background: #fff;
            display:block;
        }
        /* 移动端侧边栏 */
        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: var(--black);
            padding: 40px 30px;
            transition: right 0.4s ease;
            z-index: 1000;
        }
        .mobile-sidebar.open {
            right: 0;
        }
        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
        }
        .mobile-sidebar a {
            display: block;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            margin: 22px 0;
        }
        .mobile-sidebar a:hover {
            color: var(--gold);
        }
        .mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 998;
        }
        .mask.show {
            display: block;
        }
        /* 首屏横幅 */

            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), #222;
            height: 440px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }
        .banner-box h1 {
            color: var(--light-gold);
            font-size: 40px;
            margin-bottom: 18px;
        }
        .banner-desc {
            font-size: 18px;
            max-width: 750px;
            line-height: 1.9;
            margin-bottom: 30px;
        }
        .banner-btn {
            padding: 14px 36px;
            background: var(--gold);
            color: var(--black);
            text-decoration: none;
            font-weight: 600;
            border-radius: 3px;
            transition: 0.3s;
        }
        .banner-btn:hover {
            background: var(--light-gold);
        }
        /* 通用区块 */
        .section-wrap {
            padding: 70px 5%;
        }
        .section-title {
            text-align: center;
            font-size: 30px;
            color: var(--black);
            margin-bottom: 48px;
        }
        .story-text {
            max-width: 1000px;
            margin: 0 auto 60px;
            text-align: center;
            line-height: 2;
            font-size: 17px;
            color: var(--text-gray);
        }
        /* 爱情系列布局 */
        .love-series-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 36px;
            margin-bottom: 70px;
        }
        .series-card {
            border: 1px solid #eee;
            padding: 32px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .series-card:hover {
            box-shadow: 0 8px 24px #ddd;
        }
        .series-card h3 {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 16px;
        }
        .series-card p {
            color: var(--text-gray);
            line-height: 1.8;
        }
        /* 产品板块 */
        .product-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 32px;
            margin: 60px 0;
        }
        .product-card {
            border: 1px solid #eee;
            padding: 28px;
            border-radius: 8px;
        }
        .product-card h3 {
            color: var(--gold);
            margin-bottom: 14px;
            font-size: 20px;
        }
        .product-card p {
            color: var(--text-gray);
            line-height: 1.7;
        }
        /* 证书查验区 */
        .check-module {
            background: var(--gray);
            padding: 55px 5%;
            text-align: center;
            margin: 50px 0;
        }
        .check-input {
            width: 340px;
            padding: 14px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-right: 12px;
            border-radius: 2px;
        }
        .check-btn {
            padding: 14px 28px;
            background: var(--black);
            color: var(--light-gold);
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .check-result{
            max-width:700px;
            margin:30px auto 0;
            padding:25px;
            background:#fff;
            border:1px solid var(--gold);
            text-align:left;
            display:none;
            line-height:2;
        }
        .check-result.show{
            display:block;
        }
        .check-tip {
            margin-top: 18px;
            color: #666;
        }
        .about-text {
            max-width: 920px;
            margin: 0 auto;
            line-height: 1.9;
            font-size: 16px;
            color: var(--text-gray);
            text-align: center;
        }

        .notice-module {
            padding:60px 5%;
            background:#fff;
        }
        .notice-block {
            max-width:900px;
            margin:0 auto 40px;
            padding:30px;
            border:1px solid #eee;
            border-radius:10px;
        }
        .notice-block h4 {
            color:var(--gold);
            font-size:20px;
            margin-bottom:20px;
        }
        .notice-block p {
            line-height:1.8;
            color:var(--text-gray);
            margin:8px 0;
        }
        /* 页脚精简 */
        footer {
            background: var(--black);
            color: #aaa;
            padding: 36px 5%;
            text-align: center;
            margin-top: 50px;
        }
        /* 移动端适配 */
        @media(max-width: 860px) {
            .pc-menu {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .check-input {
                width: 80%;
                margin-bottom: 15px;
                margin-right: 0;
            }
            .banner-box h1 {
                font-size: 30px;
            }

        let currentLang = "bm"; // 默认马来文

        // 页面渲染语言文字
        function renderText(lang){
            currentLang = lang;
            document.querySelectorAll("[data-i18n]").forEach(el=>{
                const key = el.getAttribute("data-i18n");
                el.innerHTML = i18nDict[lang][key];
            })
            document.documentElement.lang = lang;
        }
        // 初始化默认马来文
        renderText("bm");
        // 切换语言按钮
        const langBtns = document.querySelectorAll('.lang-btn');
        langBtns.forEach(btn=>{
            btn.addEventListener('click',function(){
                const targetLang = this.getAttribute('data-lang');
                renderText(targetLang);
            })
        })

        // ========== 修复汉堡菜单点击BUG ==========
        const openBtn = document.getElementById('openMenu');
        const closeBtn = document.getElementById('closeMenu');
        const sideBar = document.getElementById('sideBar');
        const mask = document.getElementById('maskLayer');
        function closeSide(){
            sideBar.classList.remove('open');
            mask.classList.remove('show');
            document.body.style.overflow = '';
        }
        openBtn.addEventListener('click', function(e){
            e.stopPropagation();
            sideBar.classList.add('open');
            mask.classList.add('show');
            document.body.style.overflow = 'hidden';
        })
        closeBtn.addEventListener('click', closeSide);
        mask.addEventListener('click', closeSide);
        const navLinks = sideBar.querySelectorAll('a');
        navLinks.forEach(item => {
            item.addEventListener('click', closeSide)
        })

        // ========== 读取外置data.json（文件独立，不内置） ==========
        let gemPopDatabase = [];
        fetch("data.json")
        .then(res => res.json())
        .then(data => {
            gemPopDatabase = data;
            console.log("数据库加载完成，总条数：", gemPopDatabase.length);
        })
        .catch(err => {
            alert("数据库文件data.json加载失败，请确认和网页放在同一文件夹");
            console.error("读取json失败：", err);
        });

        // ========== 原版核验展示逻辑（无emoji符号，全部替换为纯文字标识） ==========
        const inputEl = document.getElementById('certInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        function searchCert(){
            resultBox.classList.remove('show');
            let inputVal = inputEl.value.trim().toUpperCase();
            if(!inputVal){
                let tip;
                if(currentLang === "bm") tip = "Sila masuk ID sijil atau kod laser";
                else if(currentLang === "cn") tip = "请输入证书编号或钻石腰码";
                else tip = "Please input certificate ID or laser code";
                resultTitle.innerText = tip;
                resultContent.innerText = "";
                resultBox.classList.add('show');
                return;
            }
            const matchItem = gemPopDatabase.find(item=>{
                return item.certId.toUpperCase() === inputVal || item.laserCode.toUpperCase() === inputVal;
            })
            if(!matchItem){
                let tip;
                if(currentLang === "bm") tip = "Tiada rekod berlian dijumpai, sila semak ID";
                else if(currentLang === "cn") tip = "未查询到对应钻石档案，请核对编号";
                else tip = "No matching diamond record found, please check ID";
                resultTitle.innerText = tip;
                resultContent.innerText = "";
                resultBox.classList.add('show');
                return;
            }
            // 全部替换纯文字标识，无任何emoji
            if(currentLang === "cn"){
                resultTitle.innerText = "【查询匹配成功】";
                resultContent.innerHTML = `
证书编号：${matchItem.certId}<br>
钻石腰码：${matchItem.laserCode}<br>
钻石类型：${matchItem.stoneType}<br>
克拉重量：${matchItem.carat}<br>
颜色等级：${matchItem.color}<br>
净度等级：${matchItem.clarity}<br>
切工等级：${matchItem.cut}<br>
证书机构：${matchItem.certOrigin}<br>
发证日期：${matchItem.issueDate}
                `;
            }else if(currentLang === "bm"){
                resultTitle.innerText = "[Success] Padanan Rekod Berjaya";
                resultContent.innerHTML = `
ID Sijil：${matchItem.certId}<br>
Kod Laser：${matchItem.laserCode}<br>
Jenis Batu：${matchItem.stoneType}<br>
Berat Karat：${matchItem.carat}<br>
Gred Warna：${matchItem.color}<br>
Gred Kejelasan：${matchItem.clarity}<br>
Gred Potongan：${matchItem.cut}<br>
Pihak Sijil：${matchItem.certOrigin}<br>
Tarikh Keluar：${matchItem.issueDate}
                `;
            }else{
                resultTitle.innerText = "[Success] Match Success";
                resultContent.innerHTML = `
Certificate ID：${matchItem.certId}<br>
Laser Code：${matchItem.laserCode}<br>
Stone Type：${matchItem.stoneType}<br>
Carat Weight：${matchItem.carat}<br>
Color Grade：${matchItem.color}<br>
Clarity Grade：${matchItem.clarity}<br>
Cut Grade：${matchItem.cut}<br>
Cert Authority：${matchItem.certOrigin}<br>
Issue Date：${matchItem.issueDate}
                `;
            }
            resultBox.classList.add('show');
        }
        searchBtn.addEventListener('click', searchCert);
        inputEl.addEventListener('keydown',e=>{
            if(e.key === "Enter") searchCert();
        })
    </script>
