<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Semak Laporan - GemPop</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        }
        body {
            background: #ffffff;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 30px;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #eee;
        }
        .nav-title {
            font-size: 1.2rem;
            font-weight: 500;
        }
        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
        }
        .search-wrap {
            padding: 10px 16px 6px;
            border-bottom: 1px solid #eee;
        }
        #gpInput {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 8px;
            background: #f9f9f9;
        }
        #checkBtn {
            width: 100%;
            padding: 10px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
        }
        #resultBox {
            padding: 10px 16px;
            display: none;
        }
        .result-qrcode {
            text-align: center;
            margin-bottom: 12px;
            min-height:130px;
        }
        .result-qrcode canvas {
            width: 130px !important;
            height: 130px !important;
            border:1px solid #eee;
        }
        .section-title {
            font-size: 1.45rem;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .sub-title {
            font-size: 1.1rem;
            margin: 16px 0 10px;
            font-weight: 500;
        }
        .row-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.96rem;
        }
        .comment-block {
            margin-top: 12px;
            line-height: 1.5;
            font-size: 0.9rem;
        }
        .lang-switch {
            margin: 0 16px 14px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        .lang-item {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.86rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .lang-item.active {
            background: #eee;
        }
        .disclaimer-footer {
            margin: 0 16px;
            font-size: 0.78rem;
            color: #444;
            line-height: 1.5;
        }
        .empty-tip {
            font-size: 0.96rem;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <div></div>
        <div class="nav-title" data-i18n="pageTitle">Semak Laporan - GemPop</div>
        <div class="brand-logo">GP</div>
    </div>

    <div class="search-wrap">
        <input type="text" id="gpInput" data-i18n-placeholder="inputPlaceholder" placeholder="Masukkan Nombor GP ID">
        <button id="checkBtn" data-i18n="btnText">Semak Butiran Batu Permata</button>
    </div>

    <div id="resultBox">
        <div class="result-qrcode" id="qrWrap"></div>

        <h2 class="section-title" data-i18n="gradingTitle">Keputusan Penggredan</h2>

        <div class="row-item">
            <span class="row-label" data-i18n="labCarat">Berat Karat</span>
            <span class="row-value" id="val-carat"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labColor">Gred Warna</span>
            <span class="row-value" id="val-color"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labClarity">Gred Kejelasan</span>
            <span class="row-value" id="val-clarity"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labCut">Gred Potongan</span>
            <span class="row-value" id="val-cut"></span>
        </div>

        <h3 class="sub-title" data-i18n="extraInfo">Maklumat Penggredan Tambahan</h3>
        <div class="row-item">
            <span class="row-label" data-i18n="labPolish">Penggilapan</span>
            <span class="row-value" id="val-polish"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labSym">Simetri</span>
            <span class="row-value" id="val-sym"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labFlu">Fluoresen</span>
            <span class="row-value" id="val-flu"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labCertNo">No. Sijil</span>
            <span class="row-value" id="val-cert"></span>
        </div>

        <div class="comment-block">
            <strong data-i18n="labComment">Komen</strong>
            <p id="val-comment"></p>
        </div>
    </div>

    <div class="lang-switch">
        <div class="lang-item" data-lang="en">🇺🇸 English</div>
        <div class="lang-item" data-lang="zh">🇨🇳 中文(简体)</div>
        <div class="lang-item active" data-lang="my">🇲🇾 Bahasa Melayu</div>
    </div>

    <div class="disclaimer-footer" data-i18n="disclaimerText"></div>

<script>
const langData = {
    en: {
        pageTitle: "Verify Your Report - GemPop",
        inputPlaceholder: "Enter GP ID Number",
        btnText: "Verify Gemstone Details",
        gradingTitle: "Grading Results",
        labCarat: "Carat Weight",
        labColor: "Color Grade",
        labClarity: "Clarity Grade",
        labCut: "Cut Grade",
        extraInfo: "Additional Grading Information",
        labPolish: "Polish",
        labSym: "Symmetry",
        labFlu: "Fluorescence",
        labCertNo: "Certificate No.",
        labComment: "Comments",
        noIdTitle: "ID Not Found",
        noIdTip: "No matching gemstone record in system.",
        disclaimerText: `Disclaimer:
1. Lab-Grown Diamond: Data refers to IGI international gem lab standards, physical paper certificates provided for all diamonds.
2. Moissanite: Moissanite does not follow official diamond 4C grading standards, color/clarity/cut for reference only. Third-party certificate only confirms silicon carbide material, no diamond grading.
3. GemPop only provides internal GP-ID query service, not official gemstone appraisal institution.`,
        commentHPHT: "Original lab-grown diamond, no color or filling treatment, HPHT manufactured, not natural diamond.",
        commentCVD: "Original lab-grown diamond, no color or filling treatment, CVD manufactured, not natural diamond.",
        commentMoissanite: "Moissanite is synthetic silicon carbide gemstone, does not follow official diamond 4C grading standards, parameters for reference only, not natural or lab-grown diamond."
    },
    zh: {
        pageTitle: "证书核验 - GemPop",
        inputPlaceholder: "输入GP编号",
        btnText: "核验宝石详情",
        gradingTitle: "分级检测结果",
        labCarat: "克拉重量",
        labColor: "颜色等级",
        labClarity: "净度等级",
        labCut: "切工等级",
        extraInfo: "附加分级信息",
        labPolish: "抛光",
        labSym: "对称度",
        labFlu: "荧光",
        labCertNo: "证书编号",
        labComment: "备注说明",
        noIdTitle: "未查询到编号",
        noIdTip: "系统内无匹配宝石档案。",
        disclaimerText: `免责声明：
1. 培育钻石：数据参考IGI国际宝石实验室标准，钻石均附带纸质实体证书。
2. 莫桑石：莫桑石不适用钻石4C官方分级，颜色/净度/切工仅作视觉参考，证书仅证明材质为碳化硅，无钻石分级效力。
3. GemPop仅提供GP编号查询，非官方珠宝鉴定机构。`,
        commentHPHT: "原生实验室培育钻石，无改色、填充优化，HPHT高温高压工艺合成，非天然钻石",
        commentCVD: "原生实验室培育钻石，无改色、填充优化，CVD化学气相沉积工艺合成，非天然钻石",
        commentMoissanite: "莫桑石为碳化硅合成宝石，不遵循钻石4C官方分级标准，参数仅视觉参考，非天然钻石、非培育钻石"
    },
    my: {
        pageTitle: "Semak Laporan - GemPop",
        inputPlaceholder: "Masukkan Nombor GP ID",
        btnText: "Semak Butiran Batu Permata",
        gradingTitle: "Keputusan Penggredan",
        labCarat: "Berat Karat",
        labColor: "Gred Warna",
        labClarity: "Gred Kejelasan",
        labCut: "Gred Potongan",
        extraInfo: "Maklumat Penggredan Tambahan",
        labPolish: "Penggilapan",
        labSym: "Simetri",
        labFlu: "Fluoresen",
        labCertNo: "No. Sijil",
        labComment: "Komen",
        noIdTitle: "ID Tidak Ditemui",
        noIdTip: "Tiada rekod batu permata yang sepadan dalam sistem.",
        disclaimerText: `Penafian:
1. Berlian Tumbuh Makmal: Data merujuk standard makmal IGI, sijil kertas fizikal disediakan untuk semua barang berlian.
2. Moissanit: Moissanit tidak guna standard 4C berlian rasmi, warna/kejelasan/potongan hanya rujukan visual. Sijil hanya sahkan bahan silikon karbida, tiada gred berlian.
3. GemPop hanya perkhidmatan semakan GP-ID dalaman, bukan institusi penilaian permata rasmi.`,
        commentHPHT: "Berlian tumbuh makmal asli, tiada rawatan pewarna/isi, dihasilkan teknik HPHT, bukan berlian semulajadi",
        commentCVD: "Berlian tumbuh makmal asli, tiada rawatan pewarna/isi, dihasilkan teknik CVD, bukan berlian semulajadi",
        commentMoissanite: "Moissanit ialah batu sintetik silikon karbida, tidak gunakan standard 4C berlian rasmi, parameter hanya rujukan visual, bukan berlian semulajadi mahupun berlian tumbuh makmal."
    }
};

let currentLang = "my";
let stoneData = [];
let cacheItem = null;

function setLang(lang) {
    currentLang = lang;
    const txt = langData[lang];
    document.title = txt.pageTitle;
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.innerText = txt[key];
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.getAttribute("data-i18n-placeholder");
        el.placeholder = txt[key];
    });
    document.querySelectorAll(".lang-item").forEach(item => {
        item.classList.toggle("active", item.dataset.lang === lang);
    });
    if (cacheItem) renderResult(cacheItem);
}

async function createQR(gpId) {
    const qrWrap = document.getElementById('qrWrap');
    qrWrap.innerHTML = "";
    const pageUrl = window.location.href.split('?')[0] + "?id=" + gpId;
    await QRCode.toCanvas(qrWrap, pageUrl, { width: 130, margin: 2 });
}

function renderResult(item) {
    cacheItem = item;
    const txt = langData[currentLang];
    const resultBox = document.getElementById("resultBox");
    resultBox.style.display = "block";

    if (!item) {
        document.getElementById("qrWrap").innerHTML = "";
        resultBox.innerHTML = `
            <h2 class="section-title">${txt.noIdTitle}</h2>
            <p class="empty-tip">${txt.noIdTip}</p>
        `;
        return;
    }

    createQR(item.gpId);
    document.getElementById('val-carat').innerText = item.carat;
    document.getElementById('val-color').innerText = item.color;
    document.getElementById('val-clarity').innerText = item.clarity;
    document.getElementById('val-cut').innerText = item.cut;
    document.getElementById('val-polish').innerText = "EXCELLENT";
    document.getElementById('val-sym').innerText = "EXCELLENT";
    document.getElementById('val-flu').innerText = "NONE";
    document.getElementById('val-cert').innerText = item["Cert-Number"] || "N/A";

    const type = item.tech?.toUpperCase() || "HPHT";
    if(type === "CVD"){
        document.getElementById('val-comment').innerText = txt.commentCVD;
    }else if(type === "MOISSANITE"){
        document.getElementById('val-comment').innerText = txt.commentMoissanite;
    }else{
        document.getElementById('val-comment').innerText = txt.commentHPHT;
    }
}

fetch('./data.json')
    .then(res => res.json())
    .then(data => {
        stoneData = data;
    })
    .catch(err => {
        console.error("data.json load failed", err);
    });

const input = document.getElementById('gpInput');
const btn = document.getElementById('checkBtn');
const langBtns = document.querySelectorAll(".lang-item");

langBtns.forEach(btn => {
    btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

btn.addEventListener('click', () => {
    const inputId = input.value.trim().toUpperCase();
    const findItem = stoneData.find(item => (item.gpId || "").trim().toUpperCase() === inputId);
    renderResult(findItem || null);
});

setLang("my");
</script>
</body>
</html>
