<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GEM POP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
/* 顶部导航栏 */
.header{
    background:#000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 18px;
}
.logo{
    color:#d4b036;
    font-size:24px;
    font-weight:700;
}
.menuBtn{
    color:#fff;
    font-size:26px;
}
/* 侧边全屏菜单 */
.sideMenu{
    position:fixed;
    top:0;
    right:-100%;
    width:100%;
    height:100vh;
    background:#000;
    z-index:999;
    padding:60px 30px;
    transition:right 0.3s;
}
.sideMenu.open{right:0;}
.closeBtn{
    position:absolute;
    top:15px;
    right:18px;
    color:#fff;
    font-size:30px;
}
.sideMenu a{
    display:block;
    color:#fff;
    text-decoration:none;
    font-size:18px;
    margin:26px 0;
}
.langBox{
    display:flex;
    gap:12px;
    margin-top:40px;
}
.langBtn{
    border:1px solid #d4b036;
    background:transparent;
    color:#d4b036;
    padding:6px 12px;
}
/* 首页黑底模块 */
.homeWrap{
    background:#000;
    min-height:calc(100vh - 62px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
.homeTitle{
    color:#d4b036;
    font-size:34px;
    font-weight:bold;
    margin-bottom:32px;
}
.yellowRect{
    width:92px;
    height:36px;
    background:#d4b036;
}
/* 系列列表页面 */
.seriesWrap{
    background:#fff;
    min-height:calc(100vh - 62px);
    padding:20px 18px;
    display:none;
}
.seriesItem{
    border:1px solid #eee;
    border-radius:6px;
    padding:24px 20px;
    margin-bottom:16px;
}
.seriesText{
    color:#987a26;
    font-size:20px;
}
/* 证书查询页面 */
.checkWrap{
    background:#fff;
    min-height:calc(100vh - 62px);
    padding:30px 18px;
    display:none;
}
.searchRow{
    display:flex;
    gap:10px;
}
#certInput{
    flex:1;
    padding:16px 14px;
    border:1px solid #ccc;
    font-size:16px;
}
#searchBtn{
    background:#000;
    color:#d4b036;
    border:none;
    padding:0 20px;
}
.resultBox{
    margin-top:35px;
    border:1px solid #d4b036;
    padding:20px;
    display:none;
}
.resultBox.show{display:block;}
/* 底部页脚 */
.footer{
    background:#000;
    color:#aaa;
    text-align:center;
    padding:22px 10px;
    font-size:14px;
    line-height:1.7;
}
.page{display:none;}
.page.active{display:block;}
</style>
</head>
<body>
<!-- 顶部导航 -->
<div class="header">
    <div class="logo">GEM POP</div>
    <div class="menuBtn" id="openMenu">☰</div>
</div>
<!-- 侧边菜单 -->
<div class="sideMenu" id="sideMenu">
    <div class="closeBtn" id="closeMenu">×</div>
    <a href="#home" data-page="home">首页</a>
    <a href="#series" data-page="series">六大爱情系列</a>
    <a href="#check" data-page="check">证书查验</a>
    <div class="langBox">
        <button class="langBtn">BM</button>
        <button class="langBtn">中文</button>
        <button class="langBtn">EN</button>
    </div>
</div>

<!-- 首页 -->
<div id="home" class="page homeWrap active">
    <div class="homeTitle">GEM POP</div>
    <div class="yellowRect"></div>
</div>

<!-- 六大系列页面 -->
<div id="series" class="page seriesWrap">
    <div class="seriesItem"><div class="seriesText">Falling Love ·</div></div>
    <div class="seriesItem"><div class="seriesText">Sweet Love ·</div></div>
    <div class="seriesItem"><div class="seriesText">Promise Love ·</div></div>
    <div class="seriesItem"><div class="seriesText">True Love ·</div></div>
    <div class="seriesItem"><div class="seriesText">Eternal Love ·</div></div>
    <div class="seriesItem"><div class="seriesText">Memory Love ·</div></div>
</div>

<!-- 证书查询页面 -->
<div id="check" class="page checkWrap">
    <div class="searchRow">
        <input id="certInput" placeholder="Cert ID / Laser Code (JP/IGI/MO)">
        <button id="searchBtn">查询</button>
    </div>
    <div class="resultBox" id="resultBox">
        <h4 id="resTitle"></h4>
        <div id="resContent" style="margin-top:14px;line-height:1.8;"></div>
    </div>
</div>

<!-- 底部页脚 -->
<div class="footer">
GEM POP Jewelry Factory | GemPop Cert Check System
</div>

<script>
// 菜单开关
const sideMenu = document.getElementById('sideMenu');
document.getElementById('openMenu').onclick = ()=>sideMenu.classList.add('open');
document.getElementById('closeMenu').onclick = ()=>sideMenu.classList.remove('open');

// 页面切换
const allPage = document.querySelectorAll('.page');
const navLink = document.querySelectorAll('[data-page]');
navLink.forEach(item=>{
    item.onclick = ()=>{
        const target = item.getAttribute('data-page');
        allPage.forEach(p=>p.classList.remove('active'));
        document.getElementById(target).classList.add('active');
        sideMenu.classList.remove('open');
    }
})

// 钻石数据库
const gemDB = [
    {certId:"IGI000001",laserCode:"LP10001",type:"HPHT培育钻",carat:"1ct",color:"D",clarity:"VVS1",cut:"3EX",origin:"IGI印度",date:"2026-01-05"}
];

// 查询逻辑
const input = document.getElementById('certInput');
const searchBtn = document.getElementById('searchBtn');
const resBox = document.getElementById('resultBox');
const resTitle = document.getElementById('resTitle');
const resText = document.getElementById('resContent');

function search(){
    resBox.classList.remove('show');
    let val = input.value.trim().toUpperCase();
    if(!val){
        resTitle.innerText = "请输入证书编号或钻石腰码";
        resBox.classList.add('show');
        return;
    }
    let find = gemDB.find(d=>d.certId.toUpperCase()===val || d.laserCode.toUpperCase()===val);
    if(!find){
        resTitle.innerText = "无匹配钻石档案";
        resBox.classList.add('show');
        return;
    }
    resTitle.innerText = "查询匹配成功";
    resText.innerHTML = `
证书编号：${find.certId}<br>
钻石腰码：${find.laserCode}<br>
钻石品类：${find.type}<br>
克拉重量：${find.carat}<br>
颜色等级：${find.color}<br>
净度等级：${find.clarity}<br>
切工标准：${find.cut}<br>
证书机构：${find.origin}<br>
发证日期：${find.date}
    `;
    resBox.classList.add('show');
}
searchBtn.onclick = search;
input.addEventListener('keydown',e=>e.key==='Enter'&&search());
</script>
</body>
</html>
