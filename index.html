<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Semak Laporan - GemPop</title>
    <!-- 稳定二维码CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        }
        body {
            background: #ffffff;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 50px;
        }
        /* 顶部导航 紧凑间距 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-bottom: 1px solid #eeeeee;
        }
        .nav-title {
            font-size: 1.2rem;
            font-weight: 500;
            color: #111111;
        }
        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #000000;
        }
        /* 输入框区域 缩小上下留白，解决按钮下方大空隙 */
        .search-wrap {
            padding: 12px 18px 8px;
            border-bottom: 1px solid #eee;
        }
        #gpInput {
            width: 100%;
            padding: 11px 14px;
            font-size: 1rem;
            border: 1px solid #dddddd;
            border-radius: 6px;
            margin-bottom: 9px;
            background: #f9f9f9;
        }
        #checkBtn {
            width: 100%;
            padding: 11px;
            background: #111111;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
        }
        /* 结果区域 大幅缩小和按钮的间距 */
        #resultBox {
            padding: 12px 18px;
            display: none;
        }
        /* 二维码容器 居中展示 */
        .result-qrcode {
            text-align: center;
            margin-bottom: 16px;
            min-height: 130px;
        }
        .result-qrcode canvas {
            width: 130px !important;
            height: 130px !important;
            border: 1px solid #eee;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 16px;
            color: #000;
        }
        .sub-title {
            font-size: 1.15rem;
            margin: 22px 0 12px;
            font-weight: 500;
        }
        .row-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.98rem;
        }
        .row-label {
            color: #222;
        }
        .row-value {
            font-weight: 500;
        }
        .comment-block {
            margin-top: 14px;
            line-height: 1.55;
            font-size: 0.92rem;
            color: #222;
        }
        /* 语言切换栏 */
        .lang-switch {
            margin: 0 18px 18px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
            justify-content: flex-start;
        }
        .lang-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.88rem;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 4px;
        }
        .lang-item.active {
            background: #eee;
        }
        /* 底部免责文字 */
        .disclaimer-footer {
            margin: 0 18px;
            font-size: 0.8rem;
            color: #444;
            line-height: 1.6;
        }
        .empty-tip {
            font-size: 0.98rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <div></div>
        <div class="nav-title" data-i18n="pageTitle">Semak Laporan - GemPop</div>
        <div class="brand-logo">GP</div>
    </div>

    <div class="search-wrap">
        <input type="text" id="gpInput" data-i18n-placeholder="inputPlaceholder" placeholder="Masukkan Nombor GP ID">
        <button id="checkBtn" data-i18n="btnText">Semak Butiran Batu Permata</button>
    </div>

    <div id="resultBox">
        <!-- 二维码生成容器，查询成功自动渲染 -->
        <div class="result-qrcode" id="qrWrap"></div>

        <h2 class="section-title" data-i18n="gradingTitle">Keputusan Penggredan</h2>

        <!-- 已完全移除尺寸Ukuran参数行 -->
        <div class="row-item">
            <span class="row-label" data-i18n="labCarat">Berat Karat</span>
            <span class="row-value" id="val-carat"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labColor">Gred Warna</span>
            <span class="row-value" id="val-color"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labClarity">Gred Kejelasan</span>
            <span class="row-value" id="val-clarity"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labCut">Gred Potongan</span>
            <span class="row-value" id="val-cut"></span>
        </div>

        <h3 class="sub-title" data-i18n="extraInfo">Maklumat Penggredan Tambahan</h3>
        <div class="row-item">
            <span class="row-label" data-i18n="labPolish">Penggilapan</span>
            <span class="row-value" id="val-polish"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labSym">Simetri</span>
            <span class="row-value" id="val-sym"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labFlu">Fluoresen</span>
            <span class="row-value" id="val-flu"></span>
        </div>
        <div class="row-item">
            <span class="row-label" data-i18n="labCertNo">No. Sijil</span>
            <span class="row-value" id="val-cert"></span>
        </div>

        <div class="comment-block">
            <strong data-i18n="labComment">Komen</strong>
            <p id="val-comment"></p>
        </div>
    </div>

    <div class="lang-switch">
        <div class="lang-item" data-lang="en">🇺🇸 English</div>
        <div class="lang-item" data-lang="zh">🇨🇳 中文(简体)</div>
        <div class="lang-item active" data-lang="my">🇲🇾 Bahasa Melayu</div>
    </div>

    <div class="disclaimer-footer" data-i18n="disclaimerText"></div>

<script>
// 三语文字库
const langData = {
    en: {
        pageTitle: "Verify Your Report - GemPop",
        inputPlaceholder: "Enter GP ID Number",
        btnText: "Verify Gemstone Details",
        gradingTitle: "Grading Results",
        labCarat: "Carat Weight",
        labColor: "Color Grade",
        labClarity: "Clarity Grade",
        labCut: "Cut Grade",
        extraInfo: "Additional Grading Information",
        labPolish: "Polish",
        labSym: "Symmetry",
        labFlu: "Fluorescence",
        labCertNo: "Certificate No.",
        labComment: "Comments",
        noIdTitle: "ID Not Found",
        noIdTip: "No matching gemstone record in system.",
        disclaimerText: `Disclaimer:
1. For Lab‑Grown Diamond: Data reference standard of IGI international gem laboratory. Physical paper certificates are provided for diamond items.
2. For Moissanite: Moissanite does not adopt diamond 4C official grading standard. All color/clarity/cut are visual reference only. Third-party certificate only confirm material is silicon carbide moissanite, not diamond grading.
3. GemPop only provides internal GP-ID query service, not an independent gem testing institute, no official grading certification issued by this website.`,
        commentMoissanite: "Lab Created Moissanite - No post-growth treatment. This gemstone is Silicon Carbide synthetic moissanite, NOT natural diamond or lab-grown carbon diamond.",
        commentDiamond: "As Grown - No indication of post-growth treatment. This Laboratory Grown Diamond was created by HPHT growth process, Type IIa carbon diamond."
    },
    zh: {
        pageTitle: "证书核验 - GemPop",
        inputPlaceholder: "输入GP编号",
        btnText: "核验宝石详情",
        gradingTitle: "分级检测结果",
        labCarat: "克拉重量",
        labColor: "颜色等级",
        labClarity: "净度等级",
        labCut: "切工等级",
        extraInfo: "附加分级信息",
        labPolish: "抛光",
        labSym: "对称度",
        labFlu: "荧光",
        labCertNo: "证书编号",
        labComment: "备注说明",
        noIdTitle: "未查询到编号",
        noIdTip: "系统内无匹配宝石档案。",
        disclaimerText: `免责声明：
1. 培育钻石：数据参考IGI国际宝石实验室标准，钻石商品均附带纸质实体证书。
2. 莫桑石：莫桑石不采用钻石4C官方分级标准，颜色/净度/切工仅为视觉参考。第三方证书仅证明材质为碳化硅莫桑石，无钻石分级。
3. GemPop仅提供内部GP编号查询服务，非独立宝石检测机构，本站不具备官方鉴定资质。`,
        commentMoissanite: "实验室合成莫桑石 - 无后期优化处理。材质为碳化硅人造莫桑石，不属于天然钻石或碳质培育钻石。",
        commentDiamond: "原生培育 - 无后期改色处理。本培育钻石采用HPHT高温高压工艺合成，IIa型碳质钻石。"
    },
    my: {
        pageTitle: "Semak Laporan - GemPop",
        inputPlaceholder: "Masukkan Nombor GP ID",
        btnText: "Semak Butiran Batu Permata",
        gradingTitle: "Keputusan Penggredan",
        labCarat: "Berat Karat",
        labColor: "Gred Warna",
        labClarity: "Gred Kejelasan",
        labCut: "Gred Potongan",
        extraInfo: "Maklumat Penggredan Tambahan",
        labPolish: "Penggilapan",
        labSym: "Simetri",
        labFlu: "Fluoresen",
        labCertNo: "No. Sijil",
        labComment: "Komen",
        noIdTitle: "ID Tidak Ditemui",
        noIdTip: "Tiada rekod batu permata yang sepadan dalam sistem.",
        disclaimerText: `Penafian:
1. Berlian Tumbuh Makmal: Data merujuk standard makmal permata antarabangsa IGI. Sijil kertas fizikal disediakan untuk barang berlian.
2. Moissanit: Moissanit tidak menggunakan standard penggredan 4C berlian rasmi. Semua warna/kejelasan/potongan hanya rujukan visual. Sijil pihak ketiga hanya mengesahkan bahan silikon karbida moissanit, tiada penggredan berlian.
3. GemPop hanya menyediakan perkhidmatan pertanyaan GP-ID dalaman, bukan institusi ujian permata bebas, tiada sijil penggredan rasmi dikeluarkan laman web ini.`,
        commentMoissanite: "Moissanit Buatan Makmal - Tiada rawatan selepas pembuatan. Batu permata ini adalah moissanit sintetik silikon karbida, BUKAN berlian semulajadi atau berlian karbon tumbuh makmal.",
        commentDiamond: "Dibentuk Semulajadi - Tiada tanda rawatan selepas pembuatan. Berlian Tumbuh Makmal ini dihasilkan melalui proses HPHT suhu tinggi tekanan tinggi, berlian karbon Jenis IIa."
    }
};

let currentLang = "my"; // 默认马来语
let stoneData = [];
let cacheItem = null;

// 语言切换函数
function setLang(lang) {
    currentLang = lang;
    const txt = langData[lang];
    document.title = txt.pageTitle;
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.innerText = txt[key];
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.getAttribute("data-i18n-placeholder");
        el.placeholder = txt[key];
    });
    document.querySelectorAll(".lang-item").forEach(item => {
        item.classList.toggle("active", item.dataset.lang === lang);
    });
    if (cacheItem) renderResult(cacheItem);
}

// 二维码生成函数（异步确保渲染完成）
async function createQR(gpId) {
    const qrWrap = document.getElementById('qrWrap');
    qrWrap.innerHTML = "";
    // 拼接当前页面带编号的链接，作为二维码内容
    const pageUrl = window.location.href.split('?')[0] + "?id=" + gpId;
    await QRCode.toCanvas(qrWrap, pageUrl, { width: 130, margin: 2 });
}

// 渲染查询结果
function renderResult(item) {
    cacheItem = item;
    const txt = langData[currentLang];
    const resultBox = document.getElementById("resultBox");
    resultBox.style.display = "block";

    // 无匹配数据：清空二维码，只提示找不到
    if (!item) {
        document.getElementById("qrWrap").innerHTML = "";
        resultBox.innerHTML = `
            <h2 class="section-title">${txt.noIdTitle}</h2>
            <p class="empty-tip">${txt.noIdTip}</p>
        `;
        return;
    }

    // 有数据：自动生成二维码
    createQR(item.gpId);

    // 填充宝石参数
    document.getElementById('val-carat').innerText = item.carat;
    document.getElementById('val-color').innerText = item.color;
    document.getElementById('val-clarity').innerText = item.clarity;
    document.getElementById('val-cut').innerText = item.cut;
    document.getElementById('val-polish').innerText = "EXCELLENT";
    document.getElementById('val-sym').innerText = "EXCELLENT";
    document.getElementById('val-flu').innerText = "NONE";
    document.getElementById('val-cert').innerText = item["Cert-Number"] || "N/A";

    // 判断材质填充备注
    const type = item.stoneType.toLowerCase();
    document.getElementById('val-comment').innerText = type === "moissanite" ? txt.commentMoissanite : txt.commentDiamond;
}

// 读取宝石数据文件data.json
fetch('./data.json')
    .then(res => res.json())
    .then(data => {
        stoneData = data;
    })
    .catch(err => {
        console.error("data.json 读取失败", err);
    });

// 页面元素绑定事件
const input = document.getElementById('gpInput');
const btn = document.getElementById('checkBtn');
const langBtns = document.querySelectorAll(".lang-item");

// 语言切换点击
langBtns.forEach(btn => {
    btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

// 查询按钮点击
btn.addEventListener('click', () => {
    const inputId = input.value.trim().toUpperCase();
    const findItem = stoneData.find(item => (item.gpId || "").trim().toUpperCase() === inputId);
    renderResult(findItem || null);
});

// 页面初始化，默认马来语
setLang("my");
</script>
</body>
</html>
